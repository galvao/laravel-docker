services:
  database:
    build: database/.
    environment:
      - POSTGRES_PASSWORD=p1g2s3q4l
    restart: "unless-stopped"
    shm_size: 128mb
    ports:
      - 5433:5432
    volumes:
      - pg_data:/var/lib/postgresql/data
    container_name: "laravel-app-db"
    healthcheck:
      test: "export POSTGRES_PASSWORD=p1g2s3q4l; echo \" ALTER DATABASE postgres REFRESH COLLATION VERSION; SELECT 'CREATE DATABASE laravel-app WITH encoding=UTF8' WHERE NOT EXISTS(SELECT FROM pg_database WHERE datname='laravel-app')\\gexec\" |psql -U postgres"
      interval: 3s
      timeout: 3s
      retries: 2
  application:
    build: application/.
    restart: "always"
    ports:
      - 8081:80
    depends_on:
      database:
        condition: service_healthy
        restart: true
    volumes:
      - ./application:/var/www/html
    container_name: "laravel-app"
volumes:
  pg_data:
